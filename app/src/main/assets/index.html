<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>WordWriter - Mobile Word</title>
  <!-- PWA Manifest & Theme Color -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WordWriter">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React and ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts for Poppins & Hindi Noto Sans Devanagari -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f1f5f9;
      overflow-x: hidden;
    }
    
    /* Typography Overrides */
    .font-arial { font-family: Arial, Helvetica, sans-serif !important; }
    .font-times { font-family: 'Times New Roman', Times, serif !important; }
    .font-poppins { font-family: 'Poppins', sans-serif !important; }
    .font-devanagari { font-family: 'Noto Sans Devanagari', sans-serif !important; }
    .font-mangal { font-family: 'Mangal', 'Noto Sans Devanagari', sans-serif !important; }
    .font-devlys { font-family: 'DevLys', 'Noto Sans Devanagari', sans-serif !important; }
    .font-krutidev { font-family: 'Kruti Dev', 'Noto Sans Devanagari', sans-serif !important; }
    .font-arialunicode { font-family: 'Arial Unicode MS', 'Noto Sans Devanagari', sans-serif !important; }
    .font-calibri { font-family: Calibri, Candara, Arial, sans-serif !important; }

    /* Custom scrollbar hiding */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Column Count Styles with column rule separator */
    .word-columns-1 {
      column-count: 1 !important;
    }
    .word-columns-2 {
      column-count: 2 !important;
      column-gap: 28px !important;
      column-rule: 1px solid #cbd5e1 !important;
    }
    .word-columns-3 {
      column-count: 3 !important;
      column-gap: 20px !important;
      column-rule: 1px solid #cbd5e1 !important;
    }
    .word-columns-4 {
      column-count: 4 !important;
      column-gap: 16px !important;
      column-rule: 1px solid #cbd5e1 !important;
    }

    /* Base64 & Local Resizable Editor Image Styles */
    .editor-image {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 14px auto;
      border-radius: 6px;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .editor-image:hover, .editor-image:focus {
      border-color: #2563eb;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    /* Custom Tables inside the editor with black borders like MS Word and resizability */
    .editor-table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 13px;
      border: 2px solid #000000 !important;
    }
    .editor-table th {
      background-color: #f8fafc;
      font-weight: 600;
      color: #000000;
    }
    .editor-table td, .editor-table th {
      border: 1px solid #000000 !important;
      padding: 10px;
      min-width: 60px;
      resize: both;
      overflow: auto;
      transition: background-color 0.15s ease;
    }

    /* Comment text highlights like MS Word */
    .comment-highlight {
      background-color: rgba(254, 240, 138, 0.6) !important;
      border-bottom: 2px dashed #eab308 !important;
      cursor: pointer;
      transition: all 0.2s;
    }
    .comment-highlight:hover {
      background-color: rgba(254, 240, 138, 0.9) !important;
    }

    /* Page Break Separation style inside Editor */
    .page-break {
      border-top: 2px dashed #94a3b8;
      margin: 28px 0;
      position: relative;
      content-visibility: auto;
    }
    .page-break::after {
      content: "PAGE BREAK (PRINT CUTLINE)";
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      padding: 0 12px;
      font-size: 10px;
      color: #64748b;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    /* Scrollable Layout scale support */
    .page-container {
      perspective: 1000px;
    }

    /* System printing styles - Ensuring Columns print same to same */
    @media print {
      body {
        background-color: white !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .print-page {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 40px !important;
        box-shadow: none !important;
        border: none !important;
      }
      .word-columns-1 {
        column-count: 1 !important;
        -webkit-column-count: 1 !important;
      }
      .word-columns-2 {
        column-count: 2 !important;
        -webkit-column-count: 2 !important;
        column-gap: 28px !important;
        column-rule: 1px solid #cbd5e1 !important;
      }
      .word-columns-3 {
        column-count: 3 !important;
        -webkit-column-count: 3 !important;
        column-gap: 20px !important;
        column-rule: 1px solid #cbd5e1 !important;
      }
      .word-columns-4 {
        column-count: 4 !important;
        -webkit-column-count: 4 !important;
        column-gap: 16px !important;
        column-rule: 1px solid #cbd5e1 !important;
      }
    }

    /* Placeholder text for Contenteditable */
    [contenteditable=true]:empty:before {
      content: attr(placeholder);
      color: #94a3b8;
      display: block;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function transliterateWord(word) {
      const lowerWord = word.toLowerCase().trim();
      if (!lowerWord) return "";

      const dict = {
        "namaste": "नमस्ते",
        "kya": "क्या",
        "hai": "है",
        "nahi": "नहीं",
        "nahin": "नहीं",
        "hain": "हैं",
        "ke": "के",
        "ko": "को",

        "aap": "आप",
        "dhanyawad": "धन्यवाद",

        "aur": "और",

        "ek": "एक",
        "ho": "हो",
        "hota": "होता",
        "hote": "होते",
        "hoti": "होती",
        "ye": "ये",
        "yeh": "यह",
        "wo": "वो",
        "woh": "वह",
        "bhai": "भाई",
        "behen": "बहन",
        "ghar": "घर",
        "kaam": "काम",
        "aaj": "आज",
        "kal": "कल",
        "parso": "परसों",
        "ab": "अब",
        "tab": "तब",
        "kab": "कब",
        "sab": "सब",
        "dost": "दोस्त",
        "pyar": "प्यार",
        "pyaar": "प्यार",
        "khush": "खुश",
        "desh": "देश",
        "bharat": "भारत",
        "shubh": "शुभ",
        "din": "दिन",
        "raat": "रात",
        "samay": "समय",
        "likh": "लिख",
        "padh": "पढ़",
        "bol": "बोल",
        "sun": "सुन",
        "dekh": "देख",
        "aa": "आ",
        "ja": "जा",
        "khana": "खाना",
        "peena": "पीना",
        "rona": "रोना",
        "hasna": "हंसना",
        "sochna": "सोचना",
        "samajh": "समझ",
        "naam": "नाम",
        "baat": "बात",
        "log": "लोग",
        "shahar": "शहर",
        "gaon": "गांव",
        "paani": "पानी",
        "hawa": "हवा",
        "safal": "सफल",
        "shanti": "शांति",
        "man": "मन",
        "dil": "दिल",
        "samasya": "समस्या",
        "samadhan": "समाधान",
        "likhna": "लिखना",
        "padhna": "पढ़ना",
        "karna": "करना",
        "hona": "होना",
        "chalna": "चलना",
        "bolna": "बोलना",
        "dekhna": "देखना",
        "jaana": "जाना",
        "aana": "आना",
        "khushboo": "खुशबू",
        "sunder": "सुंदर",
        "sundar": "सुंदर",
        "achha": "अच्छा",
        "achhe": "अच्छे",
        "bura": "बुरा",
        "chhota": "छोटा",
        "bada": "बड़ा",
        "bahut": "बहुत",
        "kam": "कम",
        "jyada": "ज्यादा",
        "zyada": "ज्यादा",
        "kuch": "कुछ",
        "kaise": "कैसे",
        "kyun": "क्यों",
        "kyon": "क्यों",
        "kahaan": "कहाँ",
        "kahan": "कहाँ",
        "vahan": "वहाँ",
        "vahaan": "वहाँ",
        "yahan": "यहाँ",
        "yahaan": "यहाँ",
        "kis": "किस",
        "kise": "किसे",
        "kin": "किन",
        "mera": "मेरा",
        "meri": "मेरी",
        "mere": "मेरे",
        "tumhara": "तुम्हारा",
        "tumhari": "तुम्हारी",
        "tumhare": "तुम्हारे",
        "apna": "अपना",
        "apni": "अपनी",
        "apne": "अपने",
        "uska": "उसका",
        "uski": "उसकी",
        "uske": "उसके",
        "unka": "उनका",
        "unki": "उनकी",
        "unke": "उनके",
        "hamara": "हमारा",
        "hamari": "हमारी",
        "hamare": "हमारे",
        "mujhe": "मुझे",
        "tujhe": "तुझे",
        "hame": "हमें",
        "unhe": "उन्हें",
        "ise": "इसे",
        "inhone": "इन्होंने",
        "unhone": "उन्होंने",
        "to": "तो"
      };

      if (dict[lowerWord]) {
        return dict[lowerWord];
      }

      const consonants = {
        "ksh": "क्ष", "gya": "ज्ञा", "gy": "ज्ञ", "tra": "त्र", "tr": "त्र",
        "kh": "ख", "gh": "घ", "ch": "च", "chh": "छ", "jh": "झ", "th": "थ",
        "dh": "ध", "ph": "फ", "bh": "भ", "sh": "श", "shh": "ष",
        "k": "क", "g": "ग", "j": "ज", "t": "त", "d": "द", "n": "न",
        "p": "प", "b": "ब", "m": "म", "y": "य", "r": "र", "l": "ल",
        "v": "व", "w": "व", "h": "ह", "s": "स", "f": "फ़", "z": "ज़"
      };

      const vowels = {
        "aa": "ा", "ai": "ै", "au": "ौ", "ee": "ी", "oo": "ू", "ae": "े",
        "a": "", "i": "ि", "u": "ु", "e": "े", "o": "ो"
      };

      const initialVowels = {
        "aa": "आ", "ai": "ऐ", "au": "औ", "ee": "ई", "oo": "ऊ", "ae": "ए",
        "a": "अ", "i": "इ", "u": "उ", "e": "ए", "o": "ओ"
      };

      let result = "";
      let i = 0;
      let lastWasConsonant = false;

      while (i < lowerWord.length) {
        let matchConsonant = "";
        let matchLen = 0;

        if (i + 3 <= lowerWord.length) {
          const trip = lowerWord.substring(i, i + 3);
          if (consonants[trip]) {
            matchConsonant = consonants[trip];
            matchLen = 3;
          }
        }
        if (!matchConsonant && i + 2 <= lowerWord.length) {
          const doub = lowerWord.substring(i, i + 2);
          if (consonants[doub]) {
            matchConsonant = consonants[doub];
            matchLen = 2;
          }
        }
        if (!matchConsonant && i + 1 <= lowerWord.length) {
          const sing = lowerWord.substring(i, i + 1);
          if (consonants[sing]) {
            matchConsonant = consonants[sing];
            matchLen = 1;
          }
        }

        if (matchConsonant) {
          if (lastWasConsonant) {
            result += "्";
          }
          result += matchConsonant;
          i += matchLen;
          lastWasConsonant = true;
          continue;
        }

        let matchVowel = "";
        let vLen = 0;

        if (i + 2 <= lowerWord.length) {
          const doubV = lowerWord.substring(i, i + 2);
          if (lastWasConsonant) {
            if (vowels[doubV] !== undefined) {
              matchVowel = vowels[doubV];
              vLen = 2;
            }
          } else {
            if (initialVowels[doubV] !== undefined) {
              matchVowel = initialVowels[doubV];
              vLen = 2;
            }
          }
        }

        if (matchVowel === "" && i + 1 <= lowerWord.length) {
          const singV = lowerWord.substring(i, i + 1);
          if (lastWasConsonant) {
            if (vowels[singV] !== undefined) {
              matchVowel = vowels[singV];
              vLen = 1;
            }
          } else {
            if (initialVowels[singV] !== undefined) {
              matchVowel = initialVowels[singV];
              vLen = 1;
            }
          }
        }

        if (matchVowel !== "") {
          result += matchVowel;
          i += vLen;
          lastWasConsonant = false;
        } else {
          result += lowerWord[i];
          i++;
          lastWasConsonant = false;
        }
      }

      return result;
    }

    function App() {
      const [fileName, setFileName] = useState("Document 1");
      const [columnCount, setColumnCount] = useState(1);
      const [fontFamily, setFontFamily] = useState("Arial");
      const [fontSize, setFontSize] = useState("16");
      const [textColor, setTextColor] = useState("#000000");
      const [highlightColor, setHighlightColor] = useState("#ffffff");
      const [lineSpacing, setLineSpacing] = useState("1.5");
      const [wordCount, setWordCount] = useState(0);
      const [charCount, setCharCount] = useState(0);
      const [scale, setScale] = useState(100);
      
      // Comments state
      const [comments, setComments] = useState([]);
      
      // Active Cell and Table state
      const [activeCell, setActiveCell] = useState(null);
      const [activeTable, setActiveTable] = useState(null);

      // Watermark states
      const [watermarkText, setWatermarkText] = useState("");
      const [watermarkColor, setWatermarkColor] = useState("#e2e8f0");
      const [watermarkFontSize, setWatermarkFontSize] = useState("64");
      const [watermarkAngle, setWatermarkAngle] = useState("-45deg");
      const [showWatermark, setShowWatermark] = useState(false);
      const [showWatermarkModal, setShowWatermarkModal] = useState(false);

      // Comments panel toggle state
      const [showCommentsSidebar, setShowCommentsSidebar] = useState(false);

      // PWA Install states
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [showInstallBtn, setShowInstallBtn] = useState(false);
      const [showInstallGuideModal, setShowInstallGuideModal] = useState(false);

      useEffect(() => {
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker registered successfully', reg))
            .catch(err => console.warn('Service Worker registration failed', err));
        }

        const handleBeforeInstall = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
          setShowInstallBtn(true);
        };

        window.addEventListener('beforeinstallprompt', handleBeforeInstall);

        window.addEventListener('appinstalled', () => {
          setShowInstallBtn(false);
          setDeferredPrompt(null);
        });

        // Always show install option for Android Chrome users to give manual instruction modal if prompt is not triggered
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const isChrome = /Chrome/i.test(navigator.userAgent) && !/Edge/i.test(navigator.userAgent);
        if (isMobile && isChrome) {
          setShowInstallBtn(true);
        }

        return () => {
          window.removeEventListener('beforeinstallprompt', handleBeforeInstall);
        };
      }, []);

      const handleInstallApp = async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            setShowInstallBtn(false);
            setDeferredPrompt(null);
          }
        } else {
          // Open guidance modal
          setShowInstallGuideModal(true);
        }
      };

      // Modals
      const [showImageModal, setShowImageModal] = useState(false);
      const [showHelpModal, setShowHelpModal] = useState(false);
      const [isFabOpen, setIsFabOpen] = useState(false);

      // Image modal states
      const [imageUrlInput, setImageUrlInput] = useState("");
      
      // Hindi + English Typing Mode state
      const [typingLanguage, setTypingLanguage] = useState("english");

      const devanagariKeyboard = [
        "अ", "आ", "इ", "ई", "उ", "ऊ", "ए", "ऐ", "ओ", "औ", 
        "क", "ख", "ग", "घ", "ङ",
        "च", "छ", "ज", "झ", "ञ",
        "ट", "ठ", "ड", "ढ", "ण",
        "त", "थ", "द", "ध", "न",
        "प", "फ", "ब", "भ", "म",
        "य", "र", "ल", "व", "श", "ष", "स", "ह",
        "ा", "ि", "ी", "ु", "ू", "े", "ै", "ो", "ौ", "्", "ं", "ः", "ँ", "्र", "र्"
      ];

      const insertCharacter = (char) => {
        if (!editorRef.current) return;
        editorRef.current.focus();
        
        const selection = window.getSelection();
        if (selection && selection.rangeCount > 0) {
          const range = selection.getRangeAt(0);
          range.deleteContents();
          
          const textNode = document.createTextNode(char);
          range.insertNode(textNode);
          
          // Move cursor after the inserted character
          range.setStartAfter(textNode);
          range.setEndAfter(textNode);
          selection.removeAllRanges();
          selection.addRange(range);
        } else {
          editorRef.current.innerHTML += char;
        }
        handleEditorChange();
      };

      const handleKeyDown = (e) => {
        if (typingLanguage === "hindi") {
          if (e.key === ' ' || e.key === 'Enter') {
            const selection = window.getSelection();
            if (!selection || selection.rangeCount === 0) return;
            const range = selection.getRangeAt(0);
            const textNode = range.startContainer;
            
            if (textNode.nodeType === Node.TEXT_NODE) {
              const text = textNode.nodeValue;
              const offset = range.startOffset;
              
              // Get content typed before caret
              const beforeCursor = text.substring(0, offset);
              const words = beforeCursor.split(/(\s+)/);
              
              if (words.length > 0) {
                const lastWord = words[words.length - 1];
                // Convert Hinglish text on-the-fly when typing a spacing character
                if (lastWord && /^[a-zA-Z]+$/.test(lastWord)) {
                  e.preventDefault(); // Intercept spacing character
                  
                  const converted = transliterateWord(lastWord);
                  const spaceChar = e.key === ' ' ? ' ' : '\n';
                  const startText = beforeCursor.substring(0, beforeCursor.length - lastWord.length);
                  const afterCursor = text.substring(offset);
                  
                  textNode.nodeValue = startText + converted + spaceChar + afterCursor;
                  
                  // Position cursor immediately after the inserted space
                  const newRange = document.createRange();
                  newRange.setStart(textNode, (startText + converted + spaceChar).length);
                  newRange.setEnd(textNode, (startText + converted + spaceChar).length);
                  selection.removeAllRanges();
                  selection.addRange(newRange);
                  
                  handleEditorChange();
                }
              }
            }
          }
        }
      };
      
      const editorRef = useRef(null);
      const fileInputRef = useRef(null);

      // Effect to track selected cells & table
      useEffect(() => {
        const handleSelectionOrClick = () => {
          const selection = window.getSelection();
          if (selection && selection.rangeCount > 0) {
            let node = selection.getRangeAt(0).startContainer;
            let cellNode = null;
            let tableNode = null;
            
            // Walk up parent chain to find active TD or TABLE
            while (node && node !== editorRef.current && node.parentNode) {
              if (node.nodeName === 'TD' || node.nodeName === 'TH') {
                cellNode = node;
              }
              if (node.nodeName === 'TABLE') {
                tableNode = node;
                break;
              }
              node = node.parentNode;
            }
            
            setActiveCell(cellNode);
            setActiveTable(tableNode);
            
            // Set light-blue background for the active editable cell
            if (tableNode) {
              tableNode.querySelectorAll('td, th').forEach(c => {
                if (c === cellNode) {
                  c.style.backgroundColor = 'rgba(239, 246, 255, 0.9)'; // light blue-50 accent
                } else {
                  c.style.backgroundColor = '';
                }
              });
            }
          }
        };

        document.addEventListener('selectionchange', handleSelectionOrClick);
        document.addEventListener('click', handleSelectionOrClick);

        return () => {
          document.removeEventListener('selectionchange', handleSelectionOrClick);
          document.removeEventListener('click', handleSelectionOrClick);
        };
      }, []);

      const fonts = [
        { name: "Arial", value: "Arial" },
        { name: "Times New Roman", value: "Times New Roman" },
        { name: "Poppins", value: "Poppins" },
        { name: "Noto Sans Devanagari", value: "Noto Sans Devanagari" },
        { name: "Mangal", value: "Mangal" },
        { name: "DevLys", value: "DevLys" },
        { name: "Kruti Dev", value: "Kruti Dev" },
        { name: "Arial Unicode", value: "Arial Unicode" },
        { name: "Calibri", value: "Calibri" }
      ];

      const fontSizes = ["12", "14", "16", "18", "22", "28"];

      const defaultContent = `
        <h1 style="text-align: center; color: #1e3a8a; font-size: 24px; font-weight: bold; margin-bottom: 8px;">WordWriter - Mobile Word</h1>
        <p style="text-align: center; color: #64748b; font-style: italic; margin-bottom: 24px;">Mobile-Optimized Elegant Word Processor</p>
        
        <p>Yahan se likhna shuru karein... Two Column feature try karne ke liye upar Layout se 'Two Column' select karein.</p>
        <br/>
        <p><b>Core App Features:</b></p>
        <ul>
          <li><b>A4 Live Flow:</b> Live editable document modeled exactly around classical A4 standards.</li>
          <li><b>Multi-Column Columns:</b> Format pages dynamically into 1, 2, 3 or 4 columns (Layout panel). Text automatically flows across gaps!</li>
          <li><b>Rich Custom Formatting:</b> Modify bold, italic, underline, size, text color, background highlights, and line height.</li>
          <li><b>Insert Tools:</b> Click the floating action button or Layout to append 3x3 tables, images, and standard page breaks.</li>
          <li><b>Print & Export:</b> Convert any article/report to professional PDF instantly using PDF Export.</li>
        </ul>
        <br/>
        <p><i>Devanagari Script Supported:</i> आप यहाँ हिंदी भाषा में अत्यंत सुंदर आलेख लिख सकते हैं। फोंट बॉक्स से <b>Noto Sans Devanagari</b> फोंट का चयन करके इसका परीक्षण करें।</p>
      `;

      // Mount logic
      useEffect(() => {
        const savedContent = localStorage.getItem("word_editor_data");
        const savedFileName = localStorage.getItem("word_editor_name");
        const savedCols = localStorage.getItem("word_editor_cols");
        const savedSpacing = localStorage.getItem("word_editor_spacing");
        const savedComments = localStorage.getItem("word_editor_comments");

        if (savedContent && editorRef.current) {
          editorRef.current.innerHTML = savedContent;
        } else if (editorRef.current) {
          editorRef.current.innerHTML = defaultContent;
        }

        if (savedFileName) setFileName(savedFileName);
        if (savedCols) setColumnCount(parseInt(savedCols));
        if (savedSpacing) {
          setLineSpacing(savedSpacing);
          if (editorRef.current) editorRef.current.style.lineHeight = savedSpacing;
        }

        if (savedComments) {
          try {
            setComments(JSON.parse(savedComments));
          } catch(e) {
            console.error("Failed to parse comments", e);
          }
        }

        updateStats();

        // Responsive Mobile Auto Zoom logic
        const width = window.innerWidth;
        if (width < 820) {
          const autoScale = Math.round(((width - 24) / 794) * 100);
          setScale(Math.max(30, Math.min(autoScale, 95)));
        }
      }, []);

      const updateStats = () => {
        if (editorRef.current) {
          const text = editorRef.current.innerText || "";
          const words = text.trim() === "" ? 0 : text.trim().split(/\s+/).length;
          setWordCount(words);
          setCharCount(text.length);
        }
      };

      const handleEditorChange = () => {
        if (editorRef.current) {
          localStorage.setItem("word_editor_data", editorRef.current.innerHTML);
        }
        updateStats();
      };

      const handleFileNameChange = (e) => {
        const name = e.target.value;
        setFileName(name);
        localStorage.setItem("word_editor_name", name);
      };

      // Executing styling commands
      const executeCommand = (command, value = "") => {
        document.execCommand(command, false, value);
        if (editorRef.current) {
          editorRef.current.focus();
        }
        handleEditorChange();
      };

      // Custom font changer
      const applyFontFamily = (e) => {
        const fontValue = e.target.value;
        setFontFamily(fontValue);
        executeCommand("fontName", fontValue);
      };

      // Custom font size mapper
      const applyFontSize = (e) => {
        const size = e.target.value;
        setFontSize(size);
        let mapped = "3";
        if (size === "12") mapped = "2";
        else if (size === "14") mapped = "3";
        else if (size === "16") mapped = "4";
        else if (size === "18") mapped = "5";
        else if (size === "22") mapped = "6";
        else if (size === "28") mapped = "7";
        executeCommand("fontSize", mapped);
      };

      // quick increase/decrease font size by wrapping selection in dynamic span styles
      const adjustFontSize = (delta) => {
        const selection = window.getSelection();
        if (!selection || selection.rangeCount === 0) return;
        
        let newSize = parseInt(fontSize) + delta;
        newSize = Math.max(8, Math.min(72, newSize)); // Keep between 8px and 72px
        setFontSize(newSize.toString());

        const range = selection.getRangeAt(0);
        if (range.collapsed) return;

        // Apply style to selection
        const span = document.createElement("span");
        span.style.fontSize = `${newSize}px`;
        
        try {
          span.appendChild(range.extractContents());
          range.insertNode(span);
          selection.selectAllChildren(span);
        } catch (e) {
          document.execCommand("fontSize", false, "4");
        }
        handleEditorChange();
      };

      // Spacing
      const applyLineSpacing = (spacing) => {
        setLineSpacing(spacing);
        localStorage.setItem("word_editor_spacing", spacing);
        if (editorRef.current) {
          editorRef.current.style.lineHeight = spacing;
        }
        handleEditorChange();
      };

      // Table Generator
      const insertTable = () => {
        const tableHtml = `
          <table class="editor-table">
            <thead>
              <tr>
                <th contenteditable="true">Item Header</th>
                <th contenteditable="true">Description</th>
                <th contenteditable="true">Quantity</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td contenteditable="true">Sample Cell</td>
                <td contenteditable="true">Click cell to select and type</td>
                <td contenteditable="true">1</td>
              </tr>
              <tr>
                <td contenteditable="true">Sample Cell 2</td>
                <td contenteditable="true">Editable Word Table</td>
                <td contenteditable="true">5</td>
              </tr>
            </tbody>
          </table>
          <p><br></p>
        `;
        executeCommand("insertHTML", tableHtml);
        setIsFabOpen(false);
      };

      // Add Row to Table
      const addRow = () => {
        if (!activeTable) return;
        const tbody = activeTable.querySelector('tbody') || activeTable;
        let targetRow = null;
        if (activeCell) {
          targetRow = activeCell.closest('tr');
        }
        
        const numCols = activeTable.rows[0]?.cells?.length || 3;
        const newRow = document.createElement('tr');
        for (let i = 0; i < numCols; i++) {
          const newCell = document.createElement('td');
          newCell.innerHTML = "New Cell";
          newCell.setAttribute('contenteditable', 'true');
          newRow.appendChild(newCell);
        }
        
        if (targetRow) {
          targetRow.parentNode.insertBefore(newRow, targetRow.nextSibling);
        } else {
          tbody.appendChild(newRow);
        }
        handleEditorChange();
      };

      // Add Column to Table
      const addColumn = () => {
        if (!activeTable) return;
        let colIndex = -1;
        if (activeCell) {
          colIndex = activeCell.cellIndex;
        }
        
        Array.from(activeTable.rows).forEach(row => {
          const isHeader = row.parentNode?.nodeName === 'THEAD' || row.cells[0]?.nodeName === 'TH';
          const newCell = document.createElement(isHeader ? 'th' : 'td');
          newCell.innerHTML = isHeader ? "Header" : "Cell";
          newCell.setAttribute('contenteditable', 'true');
          if (colIndex >= 0 && colIndex < row.cells.length) {
            row.insertBefore(newCell, row.cells[colIndex + 1]);
          } else {
            row.appendChild(newCell);
          }
        });
        handleEditorChange();
      };

      // Delete Active Row
      const deleteRow = () => {
        if (!activeTable || !activeCell) return;
        const row = activeCell.closest('tr');
        if (row) {
          row.parentNode.removeChild(row);
          setActiveCell(null);
          handleEditorChange();
        }
      };

      // Delete Active Column
      const deleteColumn = () => {
        if (!activeTable || !activeCell) return;
        const colIndex = activeCell.cellIndex;
        if (colIndex >= 0) {
          Array.from(activeTable.rows).forEach(row => {
            if (row.cells[colIndex]) {
              row.removeChild(row.cells[colIndex]);
            }
          });
          setActiveCell(null);
          handleEditorChange();
        }
      };

      // Comments: Add a new comment to highlighted text
      const addComment = () => {
        const selection = window.getSelection();
        if (!selection || selection.isCollapsed || selection.toString().trim() === "") {
          alert("Kripya pehle document me kuch text select/highlight karein jisme comment jodna hai!");
          return;
        }

        const selectedText = selection.toString();
        const commentId = "comment_" + Date.now();

        try {
          const range = selection.getRangeAt(0);
          const span = document.createElement("span");
          span.className = "comment-highlight";
          span.setAttribute("data-comment-id", commentId);
          range.surroundContents(span);
          
          const newComment = {
            id: commentId,
            text: selectedText,
            author: "User Comment",
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            body: "Write your comment here..."
          };

          const updatedComments = [...comments, newComment];
          setComments(updatedComments);
          localStorage.setItem("word_editor_comments", JSON.stringify(updatedComments));
          handleEditorChange();
        } catch (e) {
          console.warn("surroundContents failed, falling back to highlight styling: ", e);
          // Fallback: apply highlight color and add comment
          document.execCommand("backColor", false, "rgba(254, 240, 138, 0.6)");
          const newComment = {
            id: commentId,
            text: selectedText,
            author: "User Comment",
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            body: "Write your comment here..."
          };

          const updatedComments = [...comments, newComment];
          setComments(updatedComments);
          localStorage.setItem("word_editor_comments", JSON.stringify(updatedComments));
          handleEditorChange();
        }
      };

      // Comments: Update specific comment body
      const updateCommentBody = (id, newBody) => {
        const updated = comments.map(c => c.id === id ? { ...c, body: newBody } : c);
        setComments(updated);
        localStorage.setItem("word_editor_comments", JSON.stringify(updated));
      };

      // Comments: Delete a comment & clean its span highlighting
      const deleteComment = (id) => {
        const updated = comments.filter(c => c.id !== id);
        setComments(updated);
        localStorage.setItem("word_editor_comments", JSON.stringify(updated));

        if (editorRef.current) {
          const highlights = editorRef.current.querySelectorAll(`[data-comment-id="${id}"]`);
          highlights.forEach(span => {
            const parent = span.parentNode;
            if (parent) {
              while (span.firstChild) {
                parent.insertBefore(span.firstChild, span);
              }
              parent.removeChild(span);
            }
          });
          handleEditorChange();
        }
      };

      // Insert Page Break line
      const insertPageBreak = () => {
        const pageBreakHtml = `<div class="page-break" contenteditable="false"></div><p><br></p>`;
        executeCommand("insertHTML", pageBreakHtml);
        setIsFabOpen(false);
      };

      // Image handlers
      const triggerLocalImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const imgHtml = `<img src="${event.target.result}" class="editor-image" alt="Base64 Image" />`;
            executeCommand("insertHTML", imgHtml);
          };
          reader.readAsDataURL(file);
        }
        setShowImageModal(false);
        setIsFabOpen(false);
      };

      const insertImageUrl = () => {
        if (imageUrlInput.trim() !== "") {
          const imgHtml = `<img src="${imageUrlInput.trim()}" class="editor-image" alt="URL Image" />`;
          executeCommand("insertHTML", imgHtml);
          setImageUrlInput("");
          setShowImageModal(false);
          setIsFabOpen(false);
        }
      };

      const insertPresetImage = (url) => {
        const imgHtml = `<img src="${url}" class="editor-image" alt="Preset Graphic" />`;
        executeCommand("insertHTML", imgHtml);
        setShowImageModal(false);
        setIsFabOpen(false);
      };

      const clearDocument = () => {
        if (window.confirm("Aap sach me ye dastaavez mitaana chahte hain?")) {
          if (editorRef.current) {
            editorRef.current.innerHTML = "<p><br></p>";
            handleEditorChange();
          }
        }
      };

      const clearFormatting = () => {
        executeCommand("removeFormat");
        setColumnCount(1);
        localStorage.setItem("word_editor_cols", "1");
        setLineSpacing("1.5");
        if (editorRef.current) {
          editorRef.current.style.lineHeight = "1.5";
        }
        handleEditorChange();
      };

      // PDF print integration with native android adapter fallback
      const saveAsPDF = () => {
        if (window.AndroidPrint) {
          window.AndroidPrint.printDocument(fileName);
        } else {
          window.print();
        }
      };

      const handleShare = () => {
        if (navigator.share) {
          navigator.share({
            title: fileName,
            text: editorRef.current ? editorRef.current.innerText : "WordWriter Document",
          }).catch(console.error);
        } else {
          navigator.clipboard.writeText(editorRef.current ? editorRef.current.innerText : "");
          alert("Dastaavez copy ho gaya hai clipboard par!");
        }
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-100 pb-16">
          
          {/* MS WORD TITLE BAR */}
          <div className="no-print bg-blue-700 text-white px-3 sm:px-4 py-2 flex items-center justify-between shadow-md select-none shrink-0 flex-nowrap overflow-hidden">
            <div className="flex items-center gap-2 shrink-0">
              <div className="bg-white text-blue-700 font-extrabold text-sm px-1.5 py-0.5 rounded shadow flex items-center justify-center shrink-0">
                W
              </div>
              <div className="flex flex-col min-w-0">
                <input 
                  type="text" 
                  value={fileName}
                  onChange={handleFileNameChange}
                  className="bg-transparent text-xs sm:text-sm font-bold border-b border-transparent hover:border-blue-400 focus:border-white focus:outline-none px-1 py-0.5 rounded max-w-[100px] sm:max-w-[280px] text-white transition truncate"
                  placeholder="Document Name"
                />
                <span className="text-[9px] sm:text-[10px] text-blue-200 ml-1 font-medium truncate">Auto-saved Locally</span>
              </div>
            </div>

            <div className="flex items-center gap-1 sm:gap-2 shrink-0 flex-nowrap">
              {showInstallBtn && (
                <button 
                  onClick={handleInstallApp}
                  className="bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-slate-900 text-[10px] sm:text-[11px] px-2 py-1 rounded-md flex items-center gap-1 font-extrabold shadow-sm animate-pulse transition shrink-0"
                  title="Download and Install App to your phone"
                >
                  <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                  </svg>
                  <span>INSTALL</span>
                </button>
              )}

              <button 
                onClick={saveAsPDF}
                className="bg-blue-600 hover:bg-blue-500 active:bg-blue-800 text-white text-[10px] sm:text-xs px-2 py-1 rounded-md flex items-center gap-1 font-semibold transition shrink-0"
                title="Export Document as PDF"
              >
                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3M3 17V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
                </svg>
                <span>PDF</span>
              </button>

              <button 
                onClick={handleShare}
                className="bg-blue-600 hover:bg-blue-500 active:bg-blue-800 text-white text-[10px] sm:text-xs px-2 py-1 rounded-md flex items-center gap-1 font-semibold transition shrink-0"
                title="Share Document"
              >
                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 10.742l4.828-2.413m0 5.34l-4.828-2.414m5.656 3.684a3 3 0 11-6 0 3 3 0 016 0zm-6-8a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span className="hidden sm:inline">Share</span>
              </button>

              <button 
                onClick={clearDocument}
                className="bg-red-600 hover:bg-red-500 active:bg-red-800 text-white text-[10px] sm:text-xs px-2 py-1 rounded-md flex items-center gap-1 font-semibold transition shrink-0"
                title="Clear All"
              >
                <span className="hidden sm:inline">Clear</span>
                <span className="sm:hidden">❌</span>
              </button>

              <button 
                onClick={() => setShowHelpModal(true)}
                className="bg-blue-800 hover:bg-blue-950 text-white w-6 h-6 sm:w-7 sm:h-7 rounded-full flex items-center justify-center font-bold text-xs shrink-0"
                title="Help"
              >
                ?
              </button>
            </div>
          </div>

          {/* TWO ROW SCROLLABLE RIBBON TOOLBAR */}
          <div className="no-print bg-white border-b border-slate-200 shadow-sm sticky top-0 z-30 select-none">
            
            {/* Row 1: Fonts and Styles */}
            <div className="flex items-center gap-2.5 px-3 py-1.5 border-b border-slate-100 overflow-x-auto no-scrollbar scroll-smooth">
              
              {/* Language Selector Toggle */}
              <button
                onClick={() => setTypingLanguage(prev => prev === "english" ? "hindi" : "english")}
                className={`px-3 py-1.5 rounded-md border text-xs font-bold flex items-center gap-1.5 shrink-0 shadow-sm transition ${
                  typingLanguage === "hindi" 
                    ? "bg-amber-100 text-amber-900 border-amber-300 font-extrabold" 
                    : "bg-slate-100 text-slate-800 border-slate-300"
                }`}
                title="Toggle Language: English or Hindi Typing"
              >
                <span className="text-sm">A/अ</span>
                <span className="text-[10px] bg-white rounded px-1.5 py-0.5 border border-slate-200">
                  {typingLanguage === "hindi" ? "हिन्दी" : "English"}
                </span>
              </button>

              {/* Font Family Dropdown */}
              <div className="flex items-center gap-1 shrink-0 bg-slate-50 border border-slate-200 rounded-md px-2 py-1">
                <span className="text-[10px] text-slate-500 uppercase font-semibold">Font:</span>
                <select 
                  value={fontFamily} 
                  onChange={applyFontFamily}
                  className="text-xs bg-transparent font-medium text-slate-700 focus:outline-none"
                >
                  {fonts.map((f, i) => (
                    <option key={i} value={f.value}>{f.name}</option>
                  ))}
                </select>
              </div>

              {/* Font Size Dropdown */}
              <div className="flex items-center gap-1 shrink-0 bg-slate-50 border border-slate-200 rounded-md px-2 py-1">
                <span className="text-[10px] text-slate-500 uppercase font-semibold">Size:</span>
                <select 
                  value={fontSize} 
                  onChange={applyFontSize}
                  className="text-xs bg-transparent font-medium text-slate-700 focus:outline-none"
                >
                  {fontSizes.map((sz, i) => (
                    <option key={i} value={sz}>{sz}px</option>
                  ))}
                </select>
              </div>

              {/* Quick Font Size Buttons (A+ / A-) */}
              <div className="flex items-center gap-0.5 shrink-0 bg-slate-50 border border-slate-200 rounded-md p-0.5" title="A+ / A- Font Size">
                <button
                  onClick={() => adjustFontSize(2)}
                  className="w-6 h-6 hover:bg-slate-200 active:bg-slate-300 rounded text-slate-700 text-xs font-black flex items-center justify-center transition"
                  title="Increase Font Size (A+)"
                >
                  A⁺
                </button>
                <button
                  onClick={() => adjustFontSize(-2)}
                  className="w-6 h-6 hover:bg-slate-200 active:bg-slate-300 rounded text-slate-700 text-xs font-black flex items-center justify-center transition"
                  title="Decrease Font Size (A-)"
                >
                  A⁻
                </button>
              </div>

              {/* Separator */}
              <div className="h-6 w-[1px] bg-slate-200 shrink-0 mx-0.5"></div>

              {/* Style Toggles (B, I, U, S) */}
              <div className="flex items-center gap-1 shrink-0">
                <button 
                  onClick={() => executeCommand("bold")}
                  className="w-8 h-8 rounded-md hover:bg-slate-100 active:bg-slate-200 text-slate-800 border border-slate-200 font-extrabold flex items-center justify-center transition"
                  title="Bold"
                >
                  B
                </button>
                <button 
                  onClick={() => executeCommand("italic")}
                  className="w-8 h-8 rounded-md hover:bg-slate-100 active:bg-slate-200 text-slate-800 border border-slate-200 italic font-bold flex items-center justify-center transition"
                  title="Italic"
                >
                  I
                </button>
                <button 
                  onClick={() => executeCommand("underline")}
                  className="w-8 h-8 rounded-md hover:bg-slate-100 active:bg-slate-200 text-slate-800 border border-slate-200 underline font-bold flex items-center justify-center transition"
                  title="Underline"
                >
                  U
                </button>
                <button 
                  onClick={() => executeCommand("strikeThrough")}
                  className="w-8 h-8 rounded-md hover:bg-slate-100 active:bg-slate-200 text-slate-800 border border-slate-200 line-through font-bold flex items-center justify-center transition"
                  title="Strikethrough"
                >
                  S
                </button>
              </div>

              {/* Line Height shortcuts */}
              <div className="h-6 w-[1px] bg-slate-200 shrink-0 mx-0.5"></div>
              <div className="flex items-center gap-1 shrink-0">
                <span className="text-[10px] text-slate-400 font-bold uppercase mr-1">Line H:</span>
                {["1.0", "1.5", "2.0"].map((sp) => (
                  <button
                    key={sp}
                    onClick={() => applyLineSpacing(sp)}
                    className={`text-[11px] px-2 py-1 rounded transition border ${
                      lineSpacing === sp 
                        ? 'bg-blue-100 text-blue-700 border-blue-300 font-bold' 
                        : 'bg-white text-slate-600 border-slate-200'
                    }`}
                  >
                    {sp}x
                  </button>
                ))}
              </div>

            </div>

            {/* Row 2: Colors, Alignment, Lists, Actions */}
            <div className="flex items-center gap-2.5 px-3 py-1.5 border-b border-slate-100 overflow-x-auto no-scrollbar scroll-smooth">
              
              {/* Color Picks */}
              <div className="flex items-center gap-2 shrink-0">
                {/* Text color picker iconized */}
                <div className="flex items-center gap-1 bg-slate-50 border border-slate-200 rounded px-1.5 py-0.5" title="Text Color">
                  <span className="text-xs font-bold text-red-600 underline">A</span>
                  <input 
                    type="color" 
                    value={textColor} 
                    onChange={(e) => {
                      setTextColor(e.target.value);
                      executeCommand("foreColor", e.target.value);
                    }}
                    className="w-4 h-4 border-0 cursor-pointer p-0 bg-transparent"
                  />
                </div>

                {/* Highlight text picker */}
                <div className="flex items-center gap-1 bg-slate-50 border border-slate-200 rounded px-1.5 py-0.5" title="Highlight Color">
                  <span className="text-xs font-bold text-yellow-500">✎</span>
                  <input 
                    type="color" 
                    value={highlightColor} 
                    onChange={(e) => {
                      setHighlightColor(e.target.value);

                <button
                  onClick={() => setShowHelpModal(false)}
                  className="w-full py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold rounded-lg text-xs transition"
                >
                  OK, Got It!
                </button>
              </div>
            </div>
          )}

          {/* PWA INSTALLATION GUIDE MODAL FOR PHONE (CHROME/SAFARI) */}
          {showInstallGuideModal && (
            <div className="no-print fixed inset-0 bg-slate-900 bg-opacity-60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl shadow-2xl max-w-sm w-full p-5 border border-amber-200">
                <div className="flex items-center gap-2.5 mb-3 border-b border-slate-100 pb-2">
                  <span className="bg-amber-500 text-slate-950 font-extrabold px-1.5 py-0.5 rounded text-sm flex items-center justify-center">📥</span>
                  <h3 className="font-extrabold text-slate-800 text-sm">Install App to Your Phone</h3>
                </div>

                <p className="text-[11px] text-slate-500 mb-4 font-medium">
                  इस वर्ड एडिटर ऐप को सीधे अपने फ़ोन में डाउनलोड और इंस्टॉल करने के लिए इन आसान स्टेप्स को फॉलो करें:
                </p>

                <div className="space-y-3 text-xs text-slate-600 mb-5">
                  <div className="flex gap-2.5">
                    <span className="bg-slate-100 text-slate-800 font-extrabold w-5 h-5 rounded-full flex items-center justify-center shrink-0">1</span>
                    <p>अपने क्रोम ब्राउज़र में ऊपर दाईं ओर <b>3 डॉट्स (Menu ⋮)</b> बटन पर टैप करें।</p>
                  </div>
                  <div className="flex gap-2.5">
                    <span className="bg-slate-100 text-slate-800 font-extrabold w-5 h-5 rounded-full flex items-center justify-center shrink-0">2</span>
                    <p>मेन्यू लिस्ट में नीचे की ओर स्क्रॉल करें और <b>"Install app"</b> या <b>"Add to Home screen"</b> (होम स्क्रीन में जोड़ें) पर टैप करें।</p>
                  </div>
                  <div className="flex gap-2.5">
                    <span className="bg-slate-100 text-slate-800 font-extrabold w-5 h-5 rounded-full flex items-center justify-center shrink-0">3</span>
                    <p>पॉपअप आने पर <b>"Add"</b> या <b>"Install"</b> पर क्लिक करें। ऐप आपके फ़ोन स्क्रीन पर डाउनलोड हो जाएगा!</p>
                  </div>
                </div>

                <button
                  onClick={() => setShowInstallGuideModal(false)}
                  className="w-full py-2 bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-slate-950 font-extrabold rounded-lg text-xs transition shadow"
                >
                  ठीक है, समझ गया!
                </button>
              </div>
            </div>
          )}

          {/* WATERMARK CONFIGURATION MODAL */}
          {showWatermarkModal && (
            <div className="no-print fixed inset-0 bg-slate-900 bg-opacity-60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl shadow-2xl max-w-sm w-full p-6 border border-amber-300">
                <div className="flex justify-between items-center mb-4 border-b pb-2">
                  <h3 className="text-sm font-bold text-slate-800 flex items-center gap-1">
                    <span>📄</span> Document Watermark (वाटरमार्क)
                  </h3>
                  <button 
                    onClick={() => setShowWatermarkModal(false)}
                    className="text-slate-400 hover:text-slate-600 font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-4">
                  <div>
                    <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Enable Watermark</label>
                    <div className="flex items-center gap-2">
                      <input 
                        type="checkbox"
                        checked={showWatermark}
                        onChange={(e) => setShowWatermark(e.target.checked)}
                        className="w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500"
                        id="enable-wm"
                      />
                      <label htmlFor="enable-wm" className="text-xs text-slate-700 font-semibold cursor-pointer">
                        Show Watermark on Sheet
                      </label>
                    </div>
                  </div>

                  <div>
                    <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Watermark Text (शब्द)</label>
                    <input 
                      type="text"
                      value={watermarkText}
                      onChange={(e) => {
                        setWatermarkText(e.target.value);
                        setShowWatermark(true);
                      }}
                      className="w-full text-xs border border-slate-300 rounded-md p-2 focus:ring-1 focus:ring-blue-500 outline-none font-bold"
                      placeholder="e.g. CONFIDENTIAL, DRAFT, राज कुमार"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Color (रंग)</label>
                      <input 
                        type="color"
                        value={watermarkColor}
                        onChange={(e) => setWatermarkColor(e.target.value)}
                        className="w-full h-8 border border-slate-300 rounded-md p-0.5 cursor-pointer"
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Font Size (साइज)</label>
                      <select 
                        value={watermarkFontSize}
                        onChange={(e) => setWatermarkFontSize(e.target.value)}
                        className="w-full text-xs border border-slate-300 rounded-md p-2 outline-none"
                      >
                        {["36", "48", "64", "72", "90", "110"].map(sz => (
                          <option key={sz} value={sz}>{sz}px</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Layout Style</label>
                    <div className="flex gap-2">
                      <button 
                        onClick={() => setWatermarkAngle("-45deg")}
                        className={`text-xs px-3 py-1.5 border rounded-md font-semibold flex-1 ${
                          watermarkAngle === "-45deg" ? "bg-blue-100 border-blue-400 text-blue-800" : "bg-white"
                        }`}
                      >
                        Diagonal (तिरछा)
                      </button>
                      <button 
                        onClick={() => setWatermarkAngle("0deg")}
                        className={`text-xs px-3 py-1.5 border rounded-md font-semibold flex-1 ${
                          watermarkAngle === "0deg" ? "bg-blue-100 border-blue-400 text-blue-800" : "bg-white"
                        }`}
                      >
                        Horizontal (सीधा)
                      </button>
                    </div>
                  </div>
                </div>

                <div className="mt-6 flex gap-2">
                  <button
                    onClick={() => {
                      setWatermarkText("");
                      setShowWatermark(false);
                      setShowWatermarkModal(false);
                    }}
                    className="flex-1 py-2 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-semibold rounded-lg text-xs transition"
                  >
                    Clear
                  </button>
                  <button
                    onClick={() => setShowWatermarkModal(false)}
                    className="flex-1 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold rounded-lg text-xs transition shadow"
                  >
                    Apply (लागू करें)
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
